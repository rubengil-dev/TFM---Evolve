<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 890" width="820" height="890" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f8a7e"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#56635d"/>
    </marker>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#0d2a1f"/>
      <stop offset="1" stop-color="#06120d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .step { fill: #0b1f17; stroke: #2f5c49; stroke-width: 1.5; }
      .check { fill: #15160c; stroke: #c9ad2e; stroke-width: 1.5; }
      .err { fill: #121815; stroke: #56635d; stroke-width: 1.5; }
      .note { fill: none; stroke: #56635d; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .end { fill: #0f3326; stroke: #34d399; stroke-width: 3; filter: url(#glow); }
      .t { font-family: Fraunces, Georgia, serif; font-size: 17px; font-weight: 600; fill: #c4d6cc; text-anchor: middle; }
      .s { font-size: 13px; fill: #7f978b; text-anchor: middle; }
      .tr { font-family: Fraunces, Georgia, serif; font-size: 17px; font-weight: 600; fill: #a9b5af; text-anchor: middle; }
      .ty { font-family: Fraunces, Georgia, serif; font-size: 17px; font-weight: 600; fill: #d9c25a; text-anchor: middle; }
      .tw { font-family: Fraunces, Georgia, serif; font-size: 21px; font-weight: 700; fill: #34d399; text-anchor: middle; }
      .sw { font-size: 13px; fill: #a7f3d0; text-anchor: middle; }
      .lbl { font-size: 13px; font-style: italic; fill: #7fbf9f; }
      .line { stroke: #6f8a7e; stroke-width: 2; fill: none; }
      .rline { stroke: #56635d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .nline { stroke: #56635d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="820" height="890" fill="url(#bg)"/>
  <!-- A few cells in the background, like the app -->
  <g fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="2">
    <circle cx="760" cy="560" r="38"/><circle cx="760" cy="560" r="12" fill="#34d399" fill-opacity="0.06"/>
    <circle cx="60" cy="300" r="26"/><circle cx="60" cy="300" r="8" fill="#34d399" fill-opacity="0.06"/>
    <circle cx="610" cy="40" r="20"/>
    <circle cx="470" cy="620" r="16"/>
  </g>

  <!-- Portada -->
  <rect class="step" x="110" y="20" width="340" height="56" rx="14"/>
  <text class="t" x="280" y="45">Portada</text>
  <text class="s" x="280" y="65">Elige: solo analítica, o analítica y hábitos</text>
  <path class="line" d="M280,76 V108" marker-end="url(#a)"/>

  <!-- PDF -->
  <rect class="step" x="110" y="110" width="340" height="56" rx="14"/>
  <text class="t" x="280" y="135">Sube el PDF de su analítica</text>
  <text class="s" x="280" y="155">Leyendo tu analítica…</text>
  <path class="rline" d="M450,138 H518" marker-end="url(#r)"/>
  <rect class="err" x="520" y="90" width="280" height="96" rx="14"/>
  <text class="tr" x="660" y="115">No puedo calcular</text>
  <text class="s" x="660" y="136">No es un PDF, es un escaneo</text>
  <text class="s" x="660" y="153">o no es una analítica</text>
  <text class="s" x="660" y="170">Faltan demasiados valores · &lt;16 o &gt;90 años</text>
  <path class="line" d="M280,166 V208" marker-end="url(#a)"/>

  <!-- Valor imposible -->
  <rect class="check" x="110" y="210" width="340" height="56" rx="14"/>
  <text class="ty" x="280" y="235">¿Algún valor imposible?</text>
  <text class="s" x="280" y="255">Lo corrige ahí mismo o lo confirma</text>
  <path class="rline" d="M450,238 H518" marker-end="url(#r)"/>
  <rect class="err" x="520" y="212" width="280" height="52" rx="14"/>
  <text class="tr" x="660" y="235">Lo confirma: no calculo</text>
  <text class="s" x="660" y="254">y le digo que vaya al médico</text>
  <path class="line" d="M280,266 V308" marker-end="url(#a)"/>

  <!-- Preguntas comunes -->
  <rect class="step" x="110" y="310" width="340" height="56" rx="14"/>
  <text class="t" x="280" y="335">Peso y talla</text>
  <text class="s" x="280" y="355">y sexo y edad, si el PDF no los trae</text>
  <path class="line" d="M280,366 V398" marker-end="url(#a)"/>

  <!-- IMC imposible -->
  <rect class="check" x="110" y="400" width="340" height="56" rx="14"/>
  <text class="ty" x="280" y="425">¿IMC imposible?</text>
  <text class="s" x="280" y="445">Lo corrige ahí mismo o lo confirma</text>
  <path class="rline" d="M450,428 H518" marker-end="url(#r)"/>
  <rect class="err" x="520" y="406" width="280" height="44" rx="14"/>
  <text class="tr" x="660" y="434">Lo confirma: no calculo</text>

  <!-- Solo analítica: straight on; with habits: a branch that leaves and comes back -->
  <path class="line" d="M280,456 V608" marker-end="url(#a)"/>
  <text class="lbl" x="292" y="535">Solo analítica</text>
  <path class="line" d="M280,472 C280,494 150,482 150,503" marker-end="url(#a)"/>
  <text class="lbl" x="30" y="490">Analítica y hábitos</text>
  <rect class="step" x="30" y="505" width="240" height="56" rx="14"/>
  <text class="t" x="150" y="530">4 preguntas de hábitos</text>
  <text class="s" x="150" y="550">Tabaco, ejercicio, sentado y sueño</text>
  <path class="line" d="M150,561 C150,582 280,574 280,594"/>

  <!-- Calculando -->
  <rect class="step" x="110" y="610" width="340" height="44" rx="14"/>
  <text class="t" x="280" y="638">Calculando tu edad…</text>
  <path class="line" d="M280,654 V688" marker-end="url(#a)"/>

  <!-- Resultado -->
  <rect class="end" x="110" y="690" width="340" height="76" rx="14"/>
  <text class="tw" x="280" y="717">Resultado</text>
  <text class="sw" x="280" y="738">Edad biológica ± margen</text>
  <text class="sw" x="280" y="756">y qué le quita y qué le suma años</text>
  <path class="nline" d="M450,728 H520"/>
  <rect class="note" x="520" y="690" width="280" height="76" rx="14"/>
  <text class="s" x="660" y="716">Aviso rojo si su edad real</text>
  <text class="s" x="660" y="733">está fuera de 18-79 años</text>
  <text class="s" x="660" y="754">Aviso gris si el margen llega a 5</text>
  <path class="line" d="M280,766 V800" marker-end="url(#a)"/>

  <!-- Después -->
  <rect class="step" x="110" y="802" width="340" height="56" rx="14"/>
  <text class="t" x="280" y="827">Descarga o comparte</text>
  <text class="s" x="280" y="847">su resultado como imagen</text>

  <!-- Global: no connection -->
  <rect class="err" x="520" y="802" width="280" height="56" rx="14" stroke-dasharray="6 4"/>
  <text class="tr" x="660" y="826">En cualquier paso</text>
  <text class="s" x="660" y="846">Sin conexión: reintenta sin perder nada</text>
</svg>

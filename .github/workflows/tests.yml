# Tests on every push and pull request:
#   - Only the app requirements: proves they are enough to load the models and predict
#   - Without data/ (not in git): its tests are skipped; models/ is in git
name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest==9.2.0
      - run: pytest
